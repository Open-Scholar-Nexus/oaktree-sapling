name: Engine version bump

# Weekly PR moving myst.yml's engine version to the latest release, updated in place while open.
# These files resync only by hand. An archived repo runs no workflows, so it is left alone.
# https://scholar.nexus/oaktree-sapling/reference/cli#upgrade

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the bump branch
  pull-requests: write # open the bump PR

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ fromJSON(steps.upgrade.outputs.result || '{}').pr_number }}
      sha: ${{ fromJSON(steps.upgrade.outputs.result || '{}').head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: upgrade
        uses: ./.github/actions/engine
        with:
          args: upgrade --paper . --version-only --yes
        env:
          GH_TOKEN: ${{ github.token }}

  # GitHub holds the pull_request runs of a pull request github-actions[bot] opens, so the bump
  # pull request gets its preview and Journal checks here, after each push to it. The preview
  # environment admits only the default branch, where a scheduled run always starts.
  checks:
    needs: bump
    if: ${{ needs.bump.outputs.sha != '' && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    permissions:
      contents: read
      checks: write # post the "Journal checks" Check Run
      pull-requests: write # the sticky preview and checks comments
    uses: ./.github/workflows/bot-pr-checks.yml
    with:
      pr: ${{ needs.bump.outputs.pr }}
      sha: ${{ needs.bump.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
