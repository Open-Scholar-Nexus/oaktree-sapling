name: Build paper

# Stage 1 of the preview, no secrets; deploy-preview.yml deploys. Each paper builds in a job of its
# own. A push also deploys Pages: the paper, once myst.yml has a real id, or in a co-located
# repository the journal website with each listed paper at /<id>/.
# https://scholar.nexus/oaktree-sapling/design/paper-ci#design-paper-ci-two-stages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Head repo in the key, and PR groups apart from the push group.
  group: ${{ github.event_name == 'pull_request' && format('build-paper-pr-{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || 'build-paper-push-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which papers this run works on, chosen by oak; holds no secret.
  papers:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.papers.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's changed files: its merge commit against its base
      - id: papers
        uses: ./.github/actions/engine
        with:
          args: papers --for build

  build:
    needs: papers
    if: ${{ fromJSON(needs.papers.outputs.result || '{}').count > 0 }}
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJSON(needs.papers.outputs.result || '{}').papers }}
    runs-on: ubuntu-latest
    outputs:
      # The starter paper is not deployed to Pages until myst.yml has a real id.
      placeholder: ${{ fromJSON(steps.build.outputs.result || '{}').placeholder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Also drops symlinks from the site, and on a pull request leaves .pr-number for Stage 2.
      - id: build
        uses: ./.github/actions/engine
        with:
          args: build
          paper-env: true
          paper-dir: ${{ matrix.paper.dir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.paper.key && format('paper-build-{0}', matrix.paper.key) || 'paper-build' }}
          path: ${{ matrix.paper.dir }}/_build/html
          if-no-files-found: error
          include-hidden-files: true

  # Runs no paper code: the journal's own website build, then a copy of each paper's.
  assemble:
    needs: [papers, build]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          fromJSON(needs.papers.outputs.result || '{}').colocated &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: paper-build-*
          path: paper-builds
      - uses: ./.github/actions/engine
        with:
          args: assemble --builds paper-builds
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-site
          path: _build/html
          if-no-files-found: error
          include-hidden-files: true

  deploy-pages:
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          ((!fromJSON(needs.papers.outputs.result || '{}').colocated && needs.build.result == 'success' &&
            needs.build.outputs.placeholder != 'true') ||
           (fromJSON(needs.papers.outputs.result || '{}').colocated && needs.assemble.result == 'success')) }}
    needs: [papers, build, assemble]
    permissions: # never at workflow level, or build holds them
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ fromJSON(needs.papers.outputs.result || '{}').colocated && 'journal-site' || 'paper-build' }}
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
