name: Check paper

# Stage 1 of the journal checks: validates each paper in a job of its own, with no secrets;
# post-checks.yml posts the reports as one result.
# https://scholar.nexus/oaktree-sapling/design/paper-ci#design-paper-ci-two-stages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Head repo in the key: forks share branch names.
  group: ${{ github.event_name == 'pull_request' && format('check-paper-pr-{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || 'check-paper-push-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which papers this run works on, chosen by oak; holds no secret.
  papers:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.papers.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's changed files: its merge commit against its base
      - id: papers
        uses: ./.github/actions/engine
        with:
          args: papers --for check

  validate:
    needs: papers
    if: ${{ fromJSON(needs.papers.outputs.result || '{}').count > 0 }}
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJSON(needs.papers.outputs.result || '{}').papers }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Passes on a failing result, which post-checks.yml posts; fails only when no report was
      # written. On a pull request it leaves pr-number and paper beside the report.
      - uses: ./.github/actions/engine
        with:
          args: validate --report report.json
          paper-env: true
          paper-dir: ${{ matrix.paper.dir }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.paper.key && format('journal-checks-{0}', matrix.paper.key) || 'journal-checks' }}
          path: |
            report.json
            pr-number
            paper
          if-no-files-found: error
