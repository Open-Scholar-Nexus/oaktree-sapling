name: engine
description: >-
  Check out the engine repository pins.yml names, at the version myst.yml names, and run a verb.

inputs:
  args:
    description: "verb + args for the engine (e.g. 'build', 'release --tag v1.0.0')"
    required: true
  paper-env:
    description: "install paper-environment.yml; only for a job holding no secret"
    default: "false"
  paper-dir:
    description: "the paper's folder, relative to the repository root"
    default: "."

outputs:
  result:
    description: "the verb's result as JSON; read it with fromJSON"
    value: ${{ steps.dispatch.outputs.result }}

runs:
  using: composite
  steps:
    # The paper's own myst.yml, before extends. Key quoted: yq versions disagree on a bare hyphen.
    - id: ref
      shell: bash
      env:
        PAPER_DIR: ${{ inputs.paper-dir }}
      run: |
        myst="${PAPER_DIR:-.}/myst.yml"
        ref=$(yq '.project.options["oaktree-sapling"].version // ""' "$myst")
        if [ -z "$ref" ] || [ "$ref" = "null" ]; then
          echo "::error::project.options.oaktree-sapling.version missing from $myst"
          exit 1
        fi
        # Release tags only, on every event: myst.yml is ungated, and a commit or PR ref can be fork code.
        # https://scholar.nexus/oaktree-sapling/design/paper-ci#design-paper-ci-engine-ref
        # The pattern also refuses a newline, which would forge a second $GITHUB_OUTPUT line.
        # ENGINE_VERSION in the engine's src/schema.ts.
        version='^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$'
        if ! [[ "$ref" =~ $version ]]; then
          echo "::error::engine version '$ref' in $myst is not a release tag; pin one, like v1.2.3"
          exit 1
        fi
        # An older engine posts to the PR number a fork's artifact names, unchecked.
        min=$(yq '.min_engine_version // ""' .github/actions/engine/pins.yml)
        if [ -n "$min" ] && ! [[ "$min" =~ $version ]]; then
          echo "::error::min_engine_version in pins.yml is not a release tag like v1.2.3"
          exit 1
        fi
        # As compareEngineVersions: vX.Y.Z-dev.N sorts as X.Y.Z.0.N, before vX.Y.Z as X.Y.Z.1.0.
        key() { local v="${1#v}"; case "$v" in *-dev.*) echo "${v%%-*}.0.${v##*.}" ;; *) echo "$v.1.0" ;; esac; }
        if [ -n "$min" ] && ! printf '%s\n' "$(key "$min")" "$(key "$ref")" | sort -VC; then
          echo "::error::$myst pins engine $ref; these workflows need $min or newer. Run oak upgrade."
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - id: pins
      shell: bash
      run: |
        pins=.github/actions/engine/pins.yml
        engine=$(yq '.engine_repo // ""' "$pins")
        if [ -z "$engine" ] || [ "$engine" = "null" ]; then
          echo "::error::engine_repo missing from $pins"
          exit 1
        fi
        echo "engine=$engine" >> "$GITHUB_OUTPUT"
        echo "instance=$(yq '.instance_repo // "."' "$pins")" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pins.outputs.engine }}
        ref: ${{ steps.ref.outputs.ref }}
        path: .engine

    # Installing runs package scripts: never set paper-env in a job that holds a secret.
    - uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
      if: ${{ inputs.paper-env == 'true' && hashFiles('paper-environment.yml') != '' }}
      with:
        environment-file: paper-environment.yml
        cache-environment: true

    # $ARGS via env, never spliced: a v* tag may hold $( ). Unquoted to word-split; set -f stops globs.
    - id: dispatch
      shell: bash
      env:
        INSTANCE_REPO: ${{ steps.pins.outputs.instance }}
        PAPER_DIR: ${{ inputs.paper-dir }}
        ARGS: ${{ inputs.args }}
      run: |
        set -f
        .engine/ci/run.sh $ARGS
