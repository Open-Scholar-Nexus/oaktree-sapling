name: discover
description: >-
  The papers a run works on, as a build matrix: the one at the repository root, or in a co-located
  repository the papers/<id> folders. Runs no engine, since each paper pins its own.

inputs:
  for:
    description: "build: on a push, the papers registry/papers.yml lists, on a pull request the ones it changes; check: also every paper when it changes anything outside papers/"
    required: true

outputs:
  papers:
    description: 'JSON list of {"dir": ".", "key": ""} or {"dir": "papers/<id>", "key": "<id>"}'
    value: ${{ steps.discover.outputs.papers }}
  colocated:
    description: "true when the repository has a papers/ folder"
    value: ${{ steps.discover.outputs.colocated }}

runs:
  using: composite
  steps:
    # Needs a checkout with fetch-depth 2 on a pull request, to diff the merge commit with its base.
    # https://scholar.nexus/oaktree-sapling/design/paper-ci#design-paper-ci-colocated
    - id: discover
      shell: bash
      env:
        FOR: ${{ inputs.for }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [ ! -d papers ]; then
          echo 'colocated=false' >> "$GITHUB_OUTPUT"
          echo 'papers=[{"dir":".","key":""}]' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A paper id is one path segment: PAPER_ID in the engine's src/projects.ts.
        id='^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$'
        all=()
        for f in papers/*/myst.yml; do
          [ -e "$f" ] || continue
          name="${f#papers/}"
          name="${name%/myst.yml}"
          if ! [[ "$name" =~ $id ]]; then
            echo "::error::papers/$name is not named by a paper id (letters, digits, - and _)"
            exit 1
          fi
          all+=("$name")
        done
        picked=()
        if [ "$EVENT" = "pull_request" ]; then
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ "$FOR" = "check" ] && grep -v '^papers/' <<< "$changed" | grep -q .; then
            picked=("${all[@]}")
          else
            for name in "${all[@]}"; do
              if grep -q "^papers/$name/" <<< "$changed"; then picked+=("$name"); fi
            done
          fi
        elif [ "$FOR" = "build" ]; then
          # Drafts, the papers the registry does not list, are not built on a push.
          listed=""
          if [ -f registry/papers.yml ]; then
            listed=$(yq '.[].location // ""' registry/papers.yml)
          fi
          for name in "${all[@]}"; do
            if grep -qxE "\./papers/$name/?" <<< "$listed"; then picked+=("$name"); fi
          done
        else
          picked=("${all[@]}")
        fi
        json=""
        for name in "${picked[@]}"; do
          json="${json:+$json,}{\"dir\":\"papers/$name\",\"key\":\"$name\"}"
        done
        echo 'colocated=true' >> "$GITHUB_OUTPUT"
        echo "papers=[$json]" >> "$GITHUB_OUTPUT"
