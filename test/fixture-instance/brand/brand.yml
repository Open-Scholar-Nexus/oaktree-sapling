version: 1

# Paths start at the journal root. `project.options.logo` is the PDF watermark and must be a
# file, since typst can't load a URL.
site:
  options:
    logo_text: Fixture Journal
    logo: brand/logo.svg
    favicon: brand/favicon.svg
    logo_url: https://fixture.example.org
  nav:
    - title: Gallery
      url: https://fixture.example.org
project:
  options:
    logo: brand/logo-watermark.svg
