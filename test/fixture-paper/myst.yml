version: 1

# Fixture paper, built by build.test.ts and integration.test.ts. Like a paper repo's own
# config it has no `extends:`: compose adds the engine, edition and brand layers. It also sets
# `youtube` under `options`, so the tests show compose keeps option keys oak does not own.
project:
  id: fixture-2026-sample-paper
  title: A Fixture Paper for Engine Release Safety
  abstract: A short plain-language abstract for the engine release-safety fixture paper.
  date: 2026-07-09
  authors:
    - name: Ada Fixture
      orcid: 0000-0002-1825-0097
      affiliations:
        - Fixture Institute
      corresponding: true
      email: ada@example.org
      roles:
        - conceptualization
        - software
        - writing - original draft
  keywords:
    - fixtures
    - engine
  bibliography:
    - bib.bib
  options:
    youtube: https://youtu.be/dQw4w9WgXcQ
    oaktree-sapling:
      version: v0.3.0
      edition: fixture-edition
